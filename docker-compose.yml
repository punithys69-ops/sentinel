services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mockbackend:
    build:
      context: ./gateway
      dockerfile: Dockerfile.mockbackend

  gateway1:
    build:
      context: ./gateway
    environment:
      REDIS_ADDR: redis:6379
      GATEWAY_ID: gateway1
      BACKEND_ADDR: http://mockbackend:9001
    depends_on:
      redis:
        condition: service_healthy
      mockbackend:
        condition: service_started

  gateway2:
    build:
      context: ./gateway
    environment:
      REDIS_ADDR: redis:6379
      GATEWAY_ID: gateway2
      BACKEND_ADDR: http://mockbackend:9001
    depends_on:
      redis:
        condition: service_healthy
      mockbackend:
        condition: service_started

  gateway3:
    build:
      context: ./gateway
    environment:
      REDIS_ADDR: redis:6379
      GATEWAY_ID: gateway3
      BACKEND_ADDR: http://mockbackend:9001
    depends_on:
      redis:
        condition: service_healthy
      mockbackend:
        condition: service_started

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - gateway1
      - gateway2
      - gateway3
