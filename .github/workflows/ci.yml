name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Vet
        run: go vet ./...
        working-directory: gateway

      - name: Test (with race detector)
        run: go test -race -count=1 ./...
        working-directory: gateway

      - name: Build gateway
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/gateway
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/mockbackend
        working-directory: gateway
